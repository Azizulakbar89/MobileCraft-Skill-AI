name: 🔐 Cryptographic Integrity & Anti-Tamper Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Cryptographic Signatures & Checksums
        run: |
          chmod +x ./scripts/verify-integrity.sh
          ./scripts/verify-integrity.sh
